name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Format, validate and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Lint
        run: |
          tflint --init
          tflint --recursive

      - name: Scan for misconfigurations with Trivy
        run: |
          docker pull -q aquasec/trivy:0.57.1 >/dev/null
          set +e
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.57.1 config -q \
            --severity HIGH,CRITICAL --exit-code 1 /src > trivy.txt 2>&1
          rc=$?
          grep -E 'AVD-|HIGH|CRITICAL|\.tf|Failures' trivy.txt | head -30 | sed 's/^/::error::/'
          exit $rc

      - name: Check the Kubernetes test pod
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary k8s/
